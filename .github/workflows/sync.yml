name: Run DWD Pipeline

on:
  workflow_dispatch:
    inputs:
      dwd_run:
        description: 'Der vom Worker erkannte DWD-Lauf'
        required: true
        type: string  # Definiert den Typ explizit als String

concurrency:
  group: dwd-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code (main)
        uses: actions/checkout@v4

      - name: Checkout Existing Data (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: output
          fetch-depth: 1
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          DWD_TARGET_RUN: ${{ github.event.inputs.dwd_run }}
        run: python pipeline/src/dwd_pipeline.py

      - name: Force-Push Data Branch (gh-pages)
        run: |
          cd output
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Erstellt einen frischen Branch ohne History (falls er neu ist) 
          # oder hält die Datei-Nachverfolgung sauber aufrecht
          git checkout --orphan temp-branch || true
          
          git add -A
          git commit -m "DWD Weather Pipeline - Live State [skip ci]"
          
          # Drückt den Commit als einzigen Commit auf gh-pages
          git push --force origin HEAD:gh-pages
